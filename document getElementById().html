<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ejemplo 1:Mostrar un mensaje</h1>
    <p id="aviso">Mensaje inicial</p>
    <script>
        var elemento=document.getElementById("aviso");
        elemento.textContent="Hola estudiantes";
    </script>

<h1>Ejemplo 2:Cambiar el color de un boton</h1>
    <button id="btn">Haz clic</button>
     <script>
        document.getElementById("btn").style.backgroundColor="lightblue";
    </script>
</body>
</html>
