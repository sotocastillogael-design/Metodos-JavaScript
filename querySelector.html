<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ejemplo 1:Obtener un elemento por clase</h1>
    <p class="destacado">Texto importante</p>
     <script>
        document.querySelector(".destacado").style.color="red";
    </script>

<h1>Ejemplo 2:Obtener un boton y deshabilitarlo</h1>
<button class="btn">Enviar</button>
 <script>
        document.querySelector(".btn").disabled=true;
    </script>
</body>
</html>
